apiVersion: v1
kind: Namespace
metadata:
  name: biftin-dev
  labels:
    name: biftin-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biftin-dev
  namespace: biftin-dev
  labels:
    app: biftin-dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: biftin-dev
  template:
    metadata:
      labels:
        app: biftin-dev
    spec:
      containers:
      - name: biftin-dev
        image: ghcr.io/biftin/biftin.dev:630b1f76c1befa2c61e0209c1ab856879281e0b2
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        # securityContext:
        #   runAsNonRoot: true
        #   runAsUser: 1000
        #   allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: biftin-dev
  namespace: biftin-dev
  labels:
    app: biftin-dev
spec:
  selector:
    app: biftin-dev
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biftin-dev
  namespace: biftin-dev
  labels:
    app: biftin-dev
  annotations:
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-http2: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: www.biftin.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: biftin-dev
            port:
              number: 80
  tls:
  - hosts:
    - www.biftin.dev
    - biftin.dev
    secretName: biftin-dev-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: biftin-dev-pdb
  namespace: biftin-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: biftin-dev
---
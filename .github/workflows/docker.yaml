name: Docker CI
on:
  workflow_dispatch:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_LATEST: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: lower-image-name
        name: Lower case image name
        run: echo "image-name=${IMAGE_NAME@L}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower-image-name.outputs.image-name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.lower-image-name.outputs.image-name }}:${{ env.IMAGE_LATEST }}

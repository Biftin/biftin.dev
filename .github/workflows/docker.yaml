name: Docker CI
on:
  workflow_dispatch:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_LATEST: latest

jobs:
  check-actor:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.actor != 'github-actions[bot]' && github.actor != 'actions-user' && github.actor != 'GitHub Actions' }}
    steps:
      - name: Check Actor
        run: echo "Actor is ${{ github.actor }}"

  prepare:
    runs-on: ubuntu-latest
    needs: check-actor
    if: ${{ needs.check-actor.outputs.should_run == 'true' }}
    outputs:
      image-name: ${{ steps.lower-image-name.outputs.image-name }}
      partial-image-name: ${{ steps.partial-image-name.outputs.partial-image-name }}
    steps:
      - id: lower-image-name
        name: Lower case image name
        run: echo "image-name=${IMAGE_NAME@L}" >> $GITHUB_OUTPUT

      - id: partial-image-name
        name: Partial image name
        run: echo "partial-image-name=${IMAGE_NAME#*/}" >> $GITHUB_OUTPUT

  build:
    needs: [check-actor, prepare]
    if: ${{ needs.check-actor.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:${{ env.IMAGE_LATEST }}

  update-manifest:
    runs-on: ubuntu-latest
    needs: [check-actor, prepare, build]
    if: ${{ needs.check-actor.outputs.should_run == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update manifest
        run: |
          sed -i "s|${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:.*|${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:${{ github.sha }}|g" argocd/02-deployment.yaml

      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add argocd/biftin-dev.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push origin HEAD

  image-gc:
    runs-on: ubuntu-latest
    needs: [check-actor, prepare, build]
    if: ${{ needs.check-actor.outputs.should_run == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: snok/container-retention-policy@v3.0.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: ${{ needs.prepare.outputs.partial-image-name }}
          image-tags: "!latest"
          cut-off: 1h
          keep-n-most-recent: 3
